[project]
name = "hotel-agent"
version = "0.1.0"
description = "Multilingual AI reservations and guest-service agent for hotels"
readme = "README.md"
authors = [{ name = "YACIINE 105", email = "mooml.intern@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
