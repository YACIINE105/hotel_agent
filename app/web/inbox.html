<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Inbox</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    :root { --blue: #2663eb; --blue-d: #1d4ed8; --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --line: #e2e8f0;
      --soft: #f6f9fe; --panel: #fff; --bg: #f8fafc; --warn-bg: #fff7ed; --warn: #c2410c; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 "DM Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased; }
    .mono { font-family: "Geist Mono", ui-monospace, monospace; letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-inline-end: 12px; }
    .orb { width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #fff 0 6%, #bfdbfe 16%, #60a5fa 42%, #2663eb 70%, #172554 100%); }
    input, select, textarea { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38,99,235,.12); }
    .btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
    .btn:hover { border-color: #93c5fd; color: var(--blue); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-d); color: #fff; }
    .btn.warn { border-color: #fed7aa; color: var(--warn); }
    #msg { color: var(--muted); font-size: 13px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 58px); }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; height: auto; } }
    aside { border-inline-end: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
    .sim { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .sim .mono { color: var(--muted); width: 100%; }
    .sim button { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
    .sim button:hover { border-color: #93c5fd; }
    .conv { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .conv:hover { background: var(--soft); }
    .conv.active { background: #eff6ff; box-shadow: inset 3px 0 0 var(--blue); }
    .conv .last { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv .meta { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; margin-top: 2px; }
    .badge { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
    .badge.ai { background: #eff6ff; color: var(--blue); }
    section { display: flex; flex-direction: column; min-height: 0; }
    .thread-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .thread-head b { flex: 1; }
    .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .m { max-width: 72%; padding: 10px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; }
    .m.guest { align-self: flex-end; background: var(--blue); color: #fff; border-color: var(--blue); }
    .m.staff { background: var(--warn-bg); border-color: #fed7aa; }
    .m.system { align-self: center; font-size: 12px; color: var(--muted); background: none; border: 0; }
    .m .who { display: block; margin-bottom: 3px; opacity: .75; }
    .audit { font-size: 11.5px; color: var(--muted); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
    .audit .err { color: var(--bad); font-weight: 600; }
    .m.guest .audit { color: rgba(255,255,255,.85); border-top-color: rgba(255,255,255,.35); }
    .bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); align-items: flex-end; }
    .bar textarea { flex: 1; min-width: 160px; resize: vertical; min-height: 44px; border-radius: 14px; }
    .empty { color: var(--muted); padding: 24px; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="orb"></span>Staff inbox</div>
    <input id="key" type="password" placeholder="Staff API key" size="22" aria-label="Staff API key">
    <select id="prop" aria-label="Hotel"></select>
    <button class="btn" id="load">Load</button>
    <span id="msg"></span>
  </header>
  <div class="layout">
    <aside>
      <div class="sim" id="faults"><span class="mono">Simulate supplier faults</span></div>
      <div id="list"><div class="empty">Enter the staff key (demo: demo-aldau-staff-key).</div></div>
    </aside>
    <section>
      <div class="thread-head"><b id="title">No conversation selected</b><span id="state"></span></div>
      <div class="msgs" id="thread"><div class="empty">Select a conversation.</div></div>
      <div class="bar">
        <button class="btn warn" id="pause">Take over</button>
        <textarea id="reply" placeholder="Reply as hotel staff. Sending pauses the AI; the guest sees you typing."></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
    </section>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const POLL_MS = 2000;
    let key = "", prop = "", current = null, paused = false, lastSig = "", typingSentAt = 0;
    try { key = sessionStorage.getItem("staffKey") || ""; } catch {}
    $("key").value = key;
    const api = async (path, opts = {}) => {
      const r = await fetch(path, { ...opts, headers: { "X-API-Key": key, "Content-Type": "application/json" } });
      const data = r.status === 204 ? null : await r.json();
      if (!r.ok) throw new Error(data?.detail || r.statusText);
      return data;
    };
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

    $("load").onclick = async () => {
      key = $("key").value.trim();
      try { sessionStorage.setItem("staffKey", key); } catch {}
      try {
        const props = await api("/v1/staff/properties");
        $("prop").innerHTML = "";
        props.forEach((p) => $("prop").append(new Option(p.name, p.slug)));
        prop = props[0]?.slug; $("msg").textContent = "";
        refresh();
      } catch (e) { $("msg").textContent = e.message; }
    };
    $("prop").onchange = () => { prop = $("prop").value; current = null; lastSig = ""; refresh(); };

    for (const f of ["price_change", "timeout_after_success", "timeout_before_success", "fail_book", "sold_out"]) {
      const b = el("button", null, f.replaceAll("_", " "));
      b.onclick = async () => { try { await api(`/v1/staff/properties/${prop}/simulator/faults`, { method: "POST", body: JSON.stringify({ fault: f }) }); $("msg").textContent = `Armed: ${f}`; } catch (e) { $("msg").textContent = e.message; } };
      $("faults").append(b);
    }

    async function refresh() {
      if (!prop) return;
      const convs = await api(`/v1/staff/properties/${prop}/conversations`);
      const list = $("list"); list.innerHTML = "";
      if (!convs.length) list.append(el("div", "empty", "No conversations yet."));
      for (const c of convs) {
        const n = el("div", "conv" + (c.id === current ? " active" : ""));
        const last = el("div", "last", c.last_message || "(empty)"); last.dir = "auto";
        n.append(last);
        const meta = el("div", "meta mono", `${(c.language || "?")} · ${c.channel} · ${new Date(c.updated_at).toLocaleTimeString()}`);
        meta.append(el("span", c.ai_paused ? "badge" : "badge ai", c.ai_paused ? "staff" : "ai"));
        n.append(meta);
        n.onclick = () => { current = c.id; lastSig = ""; refresh(); };
        list.append(n);
      }
      if (current) await thread();
    }

    async function thread() {
      const c = await api(`/v1/staff/conversations/${current}`);
      paused = c.ai_paused;
      $("pause").textContent = paused ? "Resume AI" : "Take over";
      $("title").textContent = `Conversation ${c.id.slice(0, 8)} · ${(c.language || "?").toUpperCase()}`;
      $("state").innerHTML = "";
      $("state").append(el("span", paused ? "badge" : "badge ai", paused ? "Staff handling" : "AI handling"));
      // Re-render only when something changed, so 2-second polling doesn't reset scrolling.
      const sig = `${c.messages.length}:${c.messages.at(-1)?.id}:${paused}:${c.handoffs.length}`;
      if (sig === lastSig) return;
      const t = $("thread"), atBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 60 || !lastSig;
      lastSig = sig;
      t.innerHTML = "";
      for (const h of c.handoffs.filter((x) => x.status === "OPEN")) t.append(el("div", "m system", `Handoff requested: ${h.reason}`));
      for (const m of c.messages) {
        const n = el("div", "m " + m.sender);
        n.dir = "auto";
        n.append(el("span", "who mono", m.sender === "ai" ? "AI" : m.sender), document.createTextNode(m.content));
        const notes = [];
        if (m.audit) {
          const a = m.audit, tm = a.timings || {};
          notes.push(`sources: ${a.sources.join(", ") || "none"}`,
            `tools: ${a.tools.map((x) => x.name + (x.ok ? "" : " (failed)")).join(", ") || "none"}`,
            `first token ${tm.first_token_ms ?? "n/a"} ms`, `total ${tm.total_ms ?? "n/a"} ms`);
        }
        if (m.meta?.source === "form") notes.push("via booking form");
        if (m.meta?.offers) notes.push(`offers: ${m.meta.offers.map((o) => `${o.room_name} ${o.total} ${o.currency}`).join(" | ")}`);
        if (notes.length || m.meta?.error) {
          const a = el("div", "audit", notes.join(" · "));
          if (m.meta?.error) { a.prepend(el("span", "err", `Error: ${m.meta.error}`), document.createTextNode(notes.length ? " · " : "")); }
          n.append(a);
        }
        t.append(n);
      }
      if (atBottom) t.scrollTop = t.scrollHeight;
    }

    async function setTyping(on) {
      if (!current) return;
      try { await api(`/v1/staff/conversations/${current}/typing`, { method: "POST", body: JSON.stringify({ typing: on }) }); } catch {}
    }
    // Tell the guest we're typing, at most every 2 s; the server expires it after 5 s of silence.
    $("reply").addEventListener("input", () => {
      const now = Date.now();
      if (!$("reply").value.trim()) { typingSentAt = 0; setTyping(false); return; }
      if (now - typingSentAt > POLL_MS) { typingSentAt = now; setTyping(true); }
    });
    $("reply").addEventListener("blur", () => { typingSentAt = 0; setTyping(false); });
    $("reply").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("send").click(); });

    $("send").onclick = async () => {
      const text = $("reply").value.trim();
      if (!text || !current) return;
      await api(`/v1/staff/conversations/${current}/reply`, { method: "POST", body: JSON.stringify({ text }) });
      $("reply").value = ""; typingSentAt = 0; refresh();
    };
    $("pause").onclick = async () => {
      if (!current) return;
      await api(`/v1/staff/conversations/${current}/takeover`, { method: "POST", body: JSON.stringify({ paused: !paused }) });
      lastSig = ""; refresh();
    };
    setInterval(() => { if (key && prop && !document.hidden) refresh().catch(() => {}); }, POLL_MS);
    if (key) $("load").click();
  </script>
</body>
</html>
