<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Inbox</title>
  <style>
    :root { --bg: #f4f6f8; --panel: #fff; --ink: #1b1f23; --muted: #5f6b76; --line: #e1e5ea; --accent: #0f4c5c; --warn: #fff4e5; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101417; --panel: #182025; --ink: #e6ecef; --muted: #98a6ad; --line: #2a353b; --accent: #5fb3c6; --warn: #3a2d17; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
    header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    input, select, button, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
    button { cursor: pointer; } button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 54px); }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; height: auto; } }
    aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
    .conv { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .conv.active { background: rgba(15,76,92,.1); }
    .conv .meta { color: var(--muted); font-size: 12px; display: flex; gap: 6px; }
    .badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--warn); }
    section { display: flex; flex-direction: column; min-height: 0; }
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .m { max-width: 75%; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; }
    .m.guest { align-self: flex-end; background: var(--accent); color: #fff; border: 0; }
    .m.staff { background: var(--warn); } .m.system { align-self: center; font-size: 12px; color: var(--muted); background: none; border: 0; }
    .audit { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
    .bar textarea { flex: 1; min-width: 200px; resize: vertical; min-height: 40px; }
    .tools { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
    .empty { color: var(--muted); padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Staff inbox</h1>
    <input id="key" type="password" placeholder="Staff API key" size="22" aria-label="Staff API key">
    <select id="prop" aria-label="Hotel"></select>
    <button id="load">Load</button>
    <span id="msg" style="color:var(--muted)"></span>
  </header>
  <div class="layout">
    <aside>
      <div class="tools" id="faults"><strong>Simulator:</strong></div>
      <div id="list"><div class="empty">Enter a key (demo: demo-atlas-staff-key).</div></div>
    </aside>
    <section>
      <div class="msgs" id="thread"><div class="empty">Select a conversation.</div></div>
      <div class="bar">
        <button id="pause">Take over</button>
        <textarea id="reply" placeholder="Reply as hotel staff (pauses the AI)"></textarea>
        <button class="primary" id="send">Send</button>
      </div>
    </section>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let key = "", prop = "", current = null, paused = false;
    try { key = sessionStorage.getItem("staffKey") || ""; } catch {}
    $("key").value = key;
    const api = async (path, opts = {}) => {
      const r = await fetch(path, { ...opts, headers: { "X-API-Key": key, "Content-Type": "application/json" } });
      const data = r.status === 204 ? null : await r.json();
      if (!r.ok) throw new Error(data?.detail || r.statusText);
      return data;
    };
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

    $("load").onclick = async () => {
      key = $("key").value.trim();
      try { sessionStorage.setItem("staffKey", key); } catch {}
      try {
        const props = await api("/v1/staff/properties");
        $("prop").innerHTML = "";
        props.forEach((p) => $("prop").append(new Option(p.name, p.slug)));
        prop = props[0]?.slug; $("msg").textContent = "";
        refresh();
      } catch (e) { $("msg").textContent = e.message; }
    };
    $("prop").onchange = () => { prop = $("prop").value; current = null; refresh(); };

    for (const f of ["price_change", "timeout_after_success", "timeout_before_success", "fail_book", "sold_out"]) {
      const b = el("button", null, f);
      b.onclick = async () => { try { await api(`/v1/staff/properties/${prop}/simulator/faults`, { method: "POST", body: JSON.stringify({ fault: f }) }); $("msg").textContent = `Armed: ${f}`; } catch (e) { $("msg").textContent = e.message; } };
      $("faults").append(b);
    }

    async function refresh() {
      if (!prop) return;
      const convs = await api(`/v1/staff/properties/${prop}/conversations`);
      const list = $("list"); list.innerHTML = "";
      if (!convs.length) list.append(el("div", "empty", "No conversations yet."));
      for (const c of convs) {
        const n = el("div", "conv" + (c.id === current ? " active" : ""));
        n.append(el("div", null, c.last_message || "(empty)"));
        const meta = el("div", "meta", `${(c.language || "?").toUpperCase()} · ${c.channel} · ${new Date(c.updated_at).toLocaleTimeString()}`);
        if (c.ai_paused) meta.append(el("span", "badge", "staff"));
        n.append(meta); n.onclick = () => { current = c.id; refresh(); };
        list.append(n);
      }
      if (current) await thread();
    }

    async function thread() {
      const c = await api(`/v1/staff/conversations/${current}`);
      paused = c.ai_paused;
      $("pause").textContent = paused ? "Resume AI" : "Take over";
      const t = $("thread"); t.innerHTML = "";
      for (const h of c.handoffs.filter((x) => x.status === "OPEN")) t.append(el("div", "m system", `Handoff: ${h.reason}`));
      for (const m of c.messages) {
        const n = el("div", "m " + m.sender, m.content); n.dir = "auto";
        if (m.audit) {
          const a = m.audit, tm = a.timings || {};
          n.append(el("div", "audit", `sources: ${a.sources.join(", ") || "—"} · tools: ${a.tools.map((x) => x.name + (x.ok ? "" : "✗")).join(", ") || "—"} · first token ${tm.first_token_ms ?? "–"} ms · total ${tm.total_ms ?? "–"} ms`));
        }
        if (m.meta?.error) n.append(el("div", "audit", `⚠ ${m.meta.error}`));
        if (m.meta?.offers) n.append(el("div", "audit", `offers: ${m.meta.offers.map((o) => `${o.room_name} ${o.total} ${o.currency}`).join(" | ")}`));
        t.append(n);
      }
      t.scrollTop = t.scrollHeight;
    }

    $("send").onclick = async () => {
      const text = $("reply").value.trim();
      if (!text || !current) return;
      await api(`/v1/staff/conversations/${current}/reply`, { method: "POST", body: JSON.stringify({ text }) });
      $("reply").value = ""; refresh();
    };
    $("pause").onclick = async () => {
      if (!current) return;
      await api(`/v1/staff/conversations/${current}/takeover`, { method: "POST", body: JSON.stringify({ paused: !paused }) });
      refresh();
    };
    setInterval(() => { if (key && prop) refresh().catch(() => {}); }, 4000);
    if (key) $("load").click();
  </script>
</body>
</html>
